<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .form-container { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 8px; margin: 8px 0 15px 0; display: inline-block; border: 1px solid #ccc; box-sizing: border-box; border-radius: 4px; }
        button { background-color: #2ecc71; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #27ae60; }
        .errorlist { color: #e74c3c; font-size: 0.9em; margin-bottom: 10px; list-style: none; padding: 0; }
        a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>{{ titulo }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>
        <br>
        <a href="{% url 'listar_productos' %}">← Volver al listado</a>
    </div>
</body>
</html>
