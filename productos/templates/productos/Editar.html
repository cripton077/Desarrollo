<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { background-color: #e74c3c; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        a { color: #3498db; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>¿Estás seguro de eliminar "{{ producto.nombre }}"?</h2>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'listar_productos' %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
